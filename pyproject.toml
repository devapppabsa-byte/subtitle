[project]
name = "subtitle-app"
version = "0.1.0"
description = "Subtítulos en tiempo real con traducción, organizados por interfaces intercambiables."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "PySide6>=6.6", "sounddevice>=0.4", "groq>=0.9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
timeout = 30

[tool.ruff]
line-length = 110
target-version = "py311"
